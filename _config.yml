# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# # Site
# title: Hexo
# subtitle: ''
# description: ''
# keywords:
# author: John Doe
# language: en
# timezone: ''
title: 侘寂的小站 # 你的博客标题，和你的ID呼应
subtitle: 慢下来，记录生活与技术碎片 # 副标题，随便写
description: 分享编程、日常与思考 # 描述，给搜索引擎看的
author: wabi-sabi-c # 你的名字/ID
language: zh-CN # 改成中文
timezone: Asia/Shanghai # 时区，保证文章时间正确

sidebar:
  name: chenqfa
  description: "分享编程、日常与思考"

# 页脚信息
# footer:
#   # 版权年份
#   since: 2026

#   # 图标设置（已关闭）
#   icon:
#     name: none
#     animated: false
#     color: "#666"

#   # 版权所有者
#   owner: wabi-sabi-c

#   # 关闭 Hexo & NexT 广告
#   powered: false
#   theme:
#     enable: false

#   # 自定义文本（必须和上面的项目同级！）
#   custom_text: "不完美，也很好"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
# url: http://example.com
url: https://wabi-sabi-c.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
# post_asset_folder: false
# 开启文章资源文件夹（方便图片管理）
post_asset_folder: true  # 原配置为 false，开启后新建文章会自动生成同名文件夹存放图片
relative_link: false
future: true
syntax_highlighter: highlight.js
# 语法高亮优化（适配 NexT 的 codeblock）
# syntax_highlighter: prismjs  # 原配置为 highlight.js，切换为 prismjs 更美观（需配合主题配置）
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""
# highlight:
#   enable: false  # 关闭原生 highlight，避免冲突
# prismjs:
#   preprocess: true
#   line_number: true
#   tab_replace: "  "  # 制表符替换为 2 个空格，代码缩进更统一

# prism_plugin:
#   mode: 'preprocess'    # 可选：preprocess/inject
#   theme: 'default'      # PrismJS 主题名
#   line_number: true     # 显示行号
#   custom_css: ''        # 自定义样式（可选）

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
# index_generator:
#   path: ""
#   per_page: 10
#   order_by: -date
index_generator:
  per_page: 8  # 原配置 10，减少每页文章数，页面更轻盈
  order_by: -date  # 保持按时间倒序
# 全局分页统一
per_page: 8
pagination_dir: page

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
# per_page: 10
# pagination_dir: page


# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
# theme: landscape
theme: next
# theme: iris
# theme: paper

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# deploy:
#   type: ''
deploy:
  type: git
  repo: https://github.com/wabi-sabi-c/wabi-sabi-c.github.io.git
  branch: main
